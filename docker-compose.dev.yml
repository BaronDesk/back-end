services:

  backend:
    build:
      target: dev
    environment:
      NODE_ENV: development
      # Only needed on Docker Desktop (macOS / Windows), where inotify events do not
      # cross the VM boundary. On native Linux, delete these two — polling burns CPU.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    volumes:
      - .:/app                 # live source
      - /app/node_modules      # image's node_modules
    ports:
      - "3000:3000"            # talk to Nest directly, bypass Caddy
      - "9229:9229"            # node --inspect
    init: true
    healthcheck:
      # First compile inside a container is slow. Do not let Caddy give up on it.
      start_period: 120s
      interval: 10s
      retries: 12

  migrate:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - .:/app  # so new migration files land on the host, not in a dead container
      - /app/node_modules
    command: ["npx", "prisma", "migrate", "deploy"]

  postgres:
    ports:
      - "5432:5432"            # TablePlus / DBeaver / psql from the host

  redis:
    ports:
      - "6379:6379"

  reverse-proxy:
    ports:
      - "80:80"                # lets Caddy serve http->https redirect
      - "443:443"
