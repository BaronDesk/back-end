<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSTAM Physical Test</title>
<!-- Physical test observer. THROWAWAY TEST TOOLING (tools/physical-test/).
     Served by serve-observer.mjs, which proxies the backend on the same origin.
     Read-only except the control buttons, which call the documented REST routes. -->
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --panel2: #1e232b; --line: #2a313b;
    --text: #e6e9ee; --dim: #8a94a3; --accent: #5aa9ff;
    --ok: #3ecf8e; --warn: #f5b945; --bad: #ff5d5d; --idle: #6b7482;
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--panel2); color: var(--dim); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--bad); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  #stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; align-content: start; }
  @media (max-width: 520px) { #stations { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card.offline { opacity: .75; }
  .card-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--panel2); gap: 8px; flex-wrap: wrap; }
  .card-head b { font-size: 15px; }
  .sec { padding: 8px 12px; border-top: 1px solid var(--line); }
  .sec h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; }
  .kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; }
  .kv div span { display: block; font-size: 11px; color: var(--dim); }
  .kv div b { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button.danger { border-color: color-mix(in srgb, var(--bad) 60%, var(--line)); color: var(--bad); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  .alert { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 6px; background: color-mix(in srgb, var(--bad) 12%, transparent); margin-bottom: 4px; }
  .alert small { color: var(--dim); display: block; }
  .pin { font-size: 28px; font-weight: 700; letter-spacing: .2em; color: var(--warn); }
  .muted { color: var(--dim); }
  .err { color: var(--bad); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
  .delta { color: var(--bad); font-weight: 700; margin-left: 6px; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; max-height: calc(100vh - 90px); position: sticky; top: 72px; }
  aside h2 { font-size: 13px; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  #log { overflow-y: auto; padding: 6px 12px; font-family: Consolas, monospace; font-size: 12px; }
  #log div { padding: 2px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  #login { max-width: 360px; margin: 80px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  #login input { width: 100%; margin: 4px 0 12px; padding: 8px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
</style>
</head>
<body>

<div id="login">
  <h2 style="margin-top:0">CSTAM physical test</h2>
  <label>Username <input id="u" autocomplete="username"></label>
  <label>Password <input id="p" type="password" autocomplete="current-password"></label>
  <button class="primary" id="go">Log in</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" hidden>
  <header>
    <h1>CSTAM physical test</h1>
    <span class="pill" id="feed">feed: connecting</span>
    <span class="pill" id="who"></span>
    <span class="muted" id="venue"></span>
  </header>
  <main>
    <section id="stations"></section>
    <aside><h2>Event log</h2><div id="log"></div></aside>
  </main>
</div>

<script src="/pt/socket.io.min.js"></script>
<script>
'use strict';

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
const fmtAgo = (iso) => {
  if (!iso) return '-';
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s ago` : new Date(iso).toLocaleTimeString();
};
const fmtNum = (v, unit = '', digits = 0) => (v === undefined || v === null ? '-' : `${Number(v).toFixed(digits)}${unit}`);
const money = (cents) => (cents === undefined || cents === null ? '-' : (cents / 100).toFixed(2));

const auth = { access: null, refresh: null };
let cfg = null;
let socket = null;
/** machineId -> view state */
const S = new Map();

function log(text, cls = '') {
  const line = document.createElement('div');
  line.innerHTML = `<span class="muted">${new Date().toLocaleTimeString()}</span> <span class="${cls}">${esc(text)}</span>`;
  $('log').prepend(line);
  while ($('log').childElementCount > 300) $('log').lastChild.remove();
}

async function api(method, path, body, retried = false) {
  const res = await fetch(path, {
    method,
    headers: { 'content-type': 'application/json', ...(auth.access ? { authorization: `Bearer ${auth.access}` } : {}) },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (res.status === 401 && auth.refresh && !retried && !path.startsWith('/auth/')) {
    const r = await fetch('/auth/refresh', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ refreshToken: auth.refresh }) });
    if (r.ok) {
      const pair = await r.json();
      auth.access = pair.accessToken;
      auth.refresh = pair.refreshToken;
      if (socket) socket.auth = { token: auth.access };
      return api(method, path, body, true);
    }
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    const msg = data?.code ? `${res.status} ${data.code}: ${data.error ?? ''}` : `${res.status} ${text}`;
    throw Object.assign(new Error(msg), { status: res.status, data });
  }
  return data;
}

// ------------------------------------------------------------------ state

function station(machineId) {
  return S.get(machineId);
}

function bySerial(serial) {
  for (const st of S.values()) if (st.cfg.serial === serial) return st;
  return null;
}

function initState() {
  for (const c of cfg.stations) {
    S.set(c.machineId, {
      cfg: c,
      info: { status: 'OFFLINE' },
      telemetry: null,
      catalog: new Map(), // gameId -> { installed, reason }
      alerts: new Map(),
      lastCommand: null,
      session: null, // { id, pin, kind, data, activeSince }
      wallets: { standard: null, member: null },
      walletDelta: { standard: null, member: null },
      error: '',
    });
  }
}

// ------------------------------------------------------------------ rendering

let renderQueued = false;
function render() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    $('stations').innerHTML = [...S.values()].map(card).join('');
  });
}

function statusPill(info) {
  return info.status === 'ONLINE' ? '<span class="pill ok">ONLINE</span>' : '<span class="pill bad">OFFLINE</span>';
}

function lockPill(locked) {
  if (locked === true) return '<span class="pill warn">LOCKED</span>';
  if (locked === false) return '<span class="pill ok">UNLOCKED</span>';
  return '<span class="pill">lock ?</span>';
}

function sessionBlock(st) {
  const s = st.session;
  const kinds = ['standard', 'member'];
  const walletRows = kinds
    .map((k) => {
      const g = st.cfg.gamers[k];
      const d = st.walletDelta[k];
      return `<div><span>${esc(g.username)} wallet</span><b>${money(st.wallets[k])}</b>${d ? `<span class="delta">${d > 0 ? '+' : ''}${money(d)}</span>` : ''}</div>`;
    })
    .join('');
  let body = '<div class="muted">No session tracked.</div>';
  if (s) {
    const d = s.data ?? {};
    const live = d.status === 'ACTIVE' && s.activeSince ? Math.round((Date.now() - s.activeSince) / 1000) : 0;
    const metered = (d.meteredSeconds ?? 0) + live;
    const est = d.rateCentsPerMinute ? Math.round((metered / 60) * d.rateCentsPerMinute) : null;
    const b = d.billingBreakdown;
    const pill = { ACTIVE: 'ok', PAUSED: 'warn', PENDING: 'warn', COMPLETED: '', CANCELLED: 'bad' }[d.status] ?? '';
    body = `
      <div class="kv">
        <div><span>session (${esc(s.kind)})</span><b>${esc(String(s.id).slice(0, 8))}</b></div>
        <div><span>status</span><b><span class="pill ${pill}">${esc(d.status ?? '?')}</span></b></div>
        <div><span>rate</span><b>${d.rateCentsPerMinute ?? '-'} c/min</b></div>
        <div><span>metered${live ? ' (live est.)' : ''}</span><b>${metered}s</b></div>
        <div><span>cost so far</span><b>${est === null ? '-' : money(est)}</b></div>
        <div><span>membership</span><b>${d.appliedMembershipId ? 'applied' : 'none'}</b></div>
      </div>
      ${s.pin && d.status === 'PENDING' ? `<div style="margin-top:6px">PIN to type on the station: <span class="pin">${esc(s.pin)}</span></div>` : ''}
      ${b ? `<div style="margin-top:6px"><b>Settled:</b> ${b.meteredSeconds}s x ${b.rateCentsPerMinute} c/min = <b>${money(b.totalCents)}</b>${b.debitFailed ? ' <span class="pill bad">DEBIT FAILED</span>' : ' debited'}</div>` : ''}`;
  }
  return `<div class="sec"><h3>Session and billing</h3>${body}<div class="kv" style="margin-top:6px">${walletRows}</div></div>`;
}

function card(st) {
  const i = st.info;
  const m = st.telemetry?.metrics ?? {};
  const telAge = st.telemetry?.receivedAt;
  const id = st.cfg.machineId;
  const games = st.cfg.games
    .map((g) => {
      const c = st.catalog.get(g);
      const tag = c ? (c.installed ? '' : ` (not installed${c.reason ? ': ' + c.reason : ''})`) : ' (no report)';
      return `<button data-act="launch" data-id="${id}" data-game="${esc(g)}" title="${esc(tag)}">Launch ${esc(g)}${c?.installed ? '' : ' ⚠'}</button>`;
    })
    .join('');
  const alerts = [...st.alerts.values()]
    .map((a) => {
      const v = a.value ?? {};
      return `<div class="alert"><div><b>${esc(a.severity)}</b> ${esc(a.category)} / ${esc(a.type)}<small>${esc(v.detail ?? '')} · ${fmtAgo(a.createdAt)}</small></div><button data-act="resolve" data-alert="${esc(a.id)}">Resolve</button></div>`;
    })
    .join('');
  const cmd = st.lastCommand;
  const cmdPill = cmd ? { ACKED: 'ok', PENDING: 'warn', SENT: 'warn' }[cmd.status] ?? 'bad' : '';
  return `
  <div class="card ${i.status === 'ONLINE' ? '' : 'offline'}">
    <div class="card-head">
      <b>${esc(st.cfg.serial)}</b>
      <span>${statusPill(i)} ${lockPill(i.locked)}</span>
    </div>
    <div class="sec"><h3>Presence</h3>
      <div class="kv">
        <div><span>IP</span><b>${esc(i.ip ?? '-')}</b></div>
        <div><span>last seen</span><b>${fmtAgo(i.lastSeen)}</b></div>
        <div><span>running game</span><b>${esc(i.runningGameId ?? '-')}</b></div>
        <div><span>agent session</span><b>${esc(i.sessionId ? String(i.sessionId).slice(0, 8) : '-')}</b></div>
        <div><span>PC name</span><b>${esc(i.name ?? '-')}</b></div>
      </div>
    </div>
    <div class="sec"><h3>Telemetry <span class="muted">${telAge ? fmtAgo(telAge) : 'none yet'}</span></h3>
      <div class="kv">
        <div><span>CPU temp</span><b>${fmtNum(m['cpu.temperature_c'], ' °C')}</b></div>
        <div><span>CPU load</span><b>${fmtNum(m['cpu.load_percent'], ' %')}</b></div>
        <div><span>RAM</span><b>${fmtNum(m['memory.usage_percent'], ' %')} <span class="muted">${fmtNum(m['memory.used_gb'], '', 1)}/${fmtNum(m['memory.total_gb'], ' GB', 1)}</span></b></div>
        <div><span>GPU temp</span><b>${fmtNum(m['gpu.0.temperature_c'], ' °C')}</b></div>
        <div><span>GPU load</span><b>${fmtNum(m['gpu.0.load_percent'], ' %')}</b></div>
        <div><span>GPU mem</span><b>${fmtNum(m['gpu.0.memory_used_mb'], ' MB')}</b></div>
      </div>
    </div>
    <div class="sec"><h3>Open alerts (${st.alerts.size})</h3>${alerts || '<div class="muted">none</div>'}</div>
    ${sessionBlock(st)}
    <div class="sec"><h3>Controls</h3>
      <div class="btns">
        <button data-act="LOCK" data-id="${id}">Lock</button>
        <button data-act="UNLOCK" data-id="${id}">Unlock</button>
        <button data-act="CATALOG_UPDATE" data-id="${id}">Catalog sync</button>
        <button class="danger" data-act="SHUTDOWN" data-id="${id}">Shutdown</button>
      </div>
      <div class="btns" style="margin-top:6px">${games}</div>
      <div class="btns" style="margin-top:6px">
        <button class="primary" data-act="start" data-id="${id}" data-kind="standard">Start session (${esc(st.cfg.gamers.standard.username)})</button>
        <button class="primary" data-act="start" data-id="${id}" data-kind="member">Start session (${esc(st.cfg.gamers.member.username)}, member)</button>
        <button data-act="end" data-id="${id}">End session</button>
      </div>
      <div class="muted" style="margin-top:6px">Last command: ${cmd ? `${esc(cmd.type)} <span class="pill ${cmdPill}">${esc(cmd.status)}</span> ${esc([cmd.nackCode, cmd.nackReason, cmd.failureReason].filter(Boolean).join(' | '))}` : '-'}</div>
      ${st.error ? `<div class="err">${esc(st.error)}</div>` : ''}
    </div>
  </div>`;
}

// ------------------------------------------------------------------ controls

document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const st = btn.dataset.id ? station(btn.dataset.id) : null;
  if (st) st.error = '';
  try {
    if (act === 'resolve') {
      await api('POST', `/api/v1/alerts/${btn.dataset.alert}/resolve`);
      log(`alert ${btn.dataset.alert.slice(0, 8)} resolved`);
    } else if (act === 'launch') {
      await sendCommand(st, { type: 'LAUNCH_GAME', gameId: btn.dataset.game });
    } else if (act === 'SHUTDOWN') {
      const typed = prompt(`This really powers ${st.cfg.serial} off (forced, 2 s). Type the station name to confirm:`);
      if (typed !== st.cfg.serial) return log('shutdown cancelled');
      await sendCommand(st, { type: 'SHUTDOWN' });
    } else if (['LOCK', 'UNLOCK', 'CATALOG_UPDATE'].includes(act)) {
      await sendCommand(st, { type: act });
    } else if (act === 'start') {
      const g = st.cfg.gamers[btn.dataset.kind];
      const res = await api('POST', '/sessions', { reservationId: g.reservationId });
      st.session = { id: res.id, pin: res.pin, kind: btn.dataset.kind, data: res, activeSince: null };
      log(`${st.cfg.serial}: session ${res.id.slice(0, 8)} started for ${g.username}, rate ${res.rateCentsPerMinute} c/min, PIN ${res.pin}`, 'ok');
    } else if (act === 'end') {
      const id = st.session?.id ?? st.info.sessionId;
      if (!id) throw new Error('no session to end');
      await api('POST', `/sessions/${id}/end`, { reason: 'observer_end' });
      log(`${st.cfg.serial}: end requested for session ${String(id).slice(0, 8)}`);
    }
  } catch (err) {
    if (st) st.error = `${act}: ${err.message}`;
    log(`${st?.cfg.serial ?? ''} ${act} failed: ${err.message}`, 'bad');
  }
  render();
});

async function sendCommand(st, body) {
  const res = await api('POST', `/api/v1/stations/${st.cfg.machineId}/commands`, body);
  st.lastCommand = res;
  log(`${st.cfg.serial}: ${body.type}${body.gameId ? ' ' + body.gameId : ''} queued`);
}

// ------------------------------------------------------------------ live feed

function connectFeed() {
  socket = io(location.origin, { path: '/dashboard-io', auth: { token: auth.access }, transports: ['websocket'] });
  const pill = (text, cls) => { $('feed').textContent = `feed: ${text}`; $('feed').className = `pill ${cls}`; };
  socket.on('connect', () => { pill('live', 'ok'); log('dashboard feed connected'); });
  socket.on('disconnect', (r) => { pill('disconnected', 'bad'); log(`dashboard feed disconnected: ${r}`, 'bad'); });
  socket.on('connect_error', (e) => { pill('error', 'bad'); log(`dashboard feed error: ${e.message}`, 'bad'); });

  socket.on('station_status', (p) => {
    const st = bySerial(p.serialNumber);
    if (!st) return;
    const before = st.info;
    st.info = { ...st.info, ...p };
    if (before.status !== p.status) log(`${p.serialNumber} ${p.status}${p.ip ? ' from ' + p.ip : ''}`, p.status === 'ONLINE' ? 'ok' : 'bad');
    if (before.locked !== p.locked) log(`${p.serialNumber} ${p.locked ? 'LOCKED' : 'UNLOCKED'}`);
    if (before.sessionId !== p.sessionId) log(`${p.serialNumber} agent session ${p.sessionId ? p.sessionId.slice(0, 8) : 'cleared'}`);
    // Pick up a session started elsewhere (console, curl).
    if (p.sessionId && st.session?.id !== p.sessionId) st.session = { id: p.sessionId, pin: null, kind: 'external', data: null, activeSince: null };
    render();
  });
  socket.on('telemetry_update', (p) => {
    const st = station(p.machineId);
    if (!st) return;
    st.telemetry = p;
    render();
  });
  socket.on('alert', (a) => {
    const st = station(a.machineId);
    if (!st) return;
    const known = st.alerts.has(a.id);
    st.alerts.set(a.id, a);
    if (!known) log(`${st.cfg.serial} ALERT ${a.severity} ${a.category}/${a.type}: ${a.value?.detail ?? ''}`, 'bad');
    render();
  });
  socket.on('alert_resolved', (a) => {
    const st = station(a.machineId);
    if (!st) return;
    st.alerts.delete(a.id);
    render();
  });
  socket.on('catalog_status', (p) => {
    const st = station(p.machineId);
    if (!st) return;
    st.catalog = new Map(p.games.map((g) => [g.gameId, g]));
    log(`${st.cfg.serial} catalog_status: ${p.games.filter((g) => g.installed).length}/${p.games.length} launchable`);
    render();
  });
  socket.on('command_update', (c) => {
    const st = station(c.machineId);
    if (!st) return;
    st.lastCommand = c;
    if (['ACKED', 'NACKED', 'FAILED', 'TIMEOUT'].includes(c.status)) {
      log(`${st.cfg.serial}: ${c.type} ${c.status} ${[c.nackCode, c.nackReason, c.failureReason].filter(Boolean).join(' | ')}`, c.status === 'ACKED' ? 'ok' : 'bad');
    }
    render();
  });
}

// ------------------------------------------------------------------ polling (REST, for what the feed does not push)

async function loadStations() {
  const rows = await api('GET', '/api/v1/stations');
  for (const r of rows) {
    const st = station(r.id);
    if (st) st.info = { ...st.info, ...r };
  }
}

async function loadStationDetails(st) {
  const id = st.cfg.machineId;
  st.telemetry = await api('GET', `/api/v1/stations/${id}/telemetry`).catch(() => st.telemetry);
  const games = await api('GET', `/api/v1/stations/${id}/games`).catch(() => null);
  const list = Array.isArray(games) ? games : games?.games;
  if (Array.isArray(list)) {
    for (const g of list) if (g.installed !== null && g.installed !== undefined) st.catalog.set(g.gameId, { installed: g.installed, reason: g.reason });
  }
  const cmds = await api('GET', `/api/v1/stations/${id}/commands?limit=1`).catch(() => []);
  if (cmds?.[0]) st.lastCommand = cmds[0];
}

async function loadAlerts() {
  const rows = await api('GET', `/api/v1/alerts?status=open&branchId=${cfg.branch.id}&limit=200`);
  for (const st of S.values()) st.alerts.clear();
  for (const a of rows) station(a.machineId)?.alerts.set(a.id, a);
}

async function pollSessionsAndWallets() {
  for (const st of S.values()) {
    if (st.session?.id) {
      const data = await api('GET', `/sessions/${st.session.id}`).catch(() => null);
      if (data) {
        const prev = st.session.data?.status;
        if (data.status === 'ACTIVE' && (prev !== 'ACTIVE' || !st.session.activeSince)) st.session.activeSince = Date.now();
        if (data.status !== 'ACTIVE') st.session.activeSince = null;
        if (prev && prev !== data.status) log(`${st.cfg.serial}: session ${data.id.slice(0, 8)} ${prev} -> ${data.status}`, data.status === 'COMPLETED' ? 'ok' : '');
        if (!st.session.kind || st.session.kind === 'external') {
          const res = Object.entries(st.cfg.gamers).find(([, g]) => g.reservationId === data.reservationId);
          if (res) st.session.kind = res[0];
        }
        st.session.data = data;
      }
    }
    for (const kind of ['standard', 'member']) {
      const w = await api('GET', `/wallets/${st.cfg.gamers[kind].gamerProfileId}`).catch(() => null);
      if (!w) continue;
      const prev = st.wallets[kind];
      if (prev !== null && w.balance !== prev) {
        st.walletDelta[kind] = w.balance - prev;
        log(`${st.cfg.gamers[kind].username} wallet ${money(prev)} -> ${money(w.balance)}`, w.balance < prev ? 'bad' : 'ok');
      }
      st.wallets[kind] = w.balance;
    }
  }
  render();
}

// ------------------------------------------------------------------ boot

async function start() {
  $('loginErr').textContent = '';
  try {
    const pair = await api('POST', '/auth/login', { username: $('u').value, password: $('p').value });
    auth.access = pair.accessToken;
    auth.refresh = pair.refreshToken;
    const me = await api('GET', '/auth/me');
    $('who').textContent = `${me.username} (${me.role})`;
    if (me.role === 'GAMER') throw new Error('log in with the staff / admin account from the seed output');
  } catch (err) {
    $('loginErr').textContent = err.message;
    return;
  }
  $('login').hidden = true;
  $('app').hidden = false;
  $('venue').textContent = `${cfg.branch.name} · ${cfg.stations.length} station(s) · ${cfg.pricing.standardCentsPerMinute} c/min, members ${cfg.membershipPlan.discountPercent}% off`;
  initState();
  connectFeed();
  await loadStations().catch((e) => log(`stations: ${e.message}`, 'bad'));
  await Promise.all([...S.values()].map((st) => loadStationDetails(st)));
  await loadAlerts().catch((e) => log(`alerts: ${e.message}`, 'bad'));
  await pollSessionsAndWallets();
  render();
  setInterval(pollSessionsAndWallets, 3000);
  setInterval(() => loadStations().then(render).catch(() => {}), 15000);
  setInterval(render, 1000); // keeps "x s ago" and live metering estimates moving
}

(async () => {
  try {
    cfg = await (await fetch('/pt/config.json')).json();
    $('u').value = cfg.admin.username;
  } catch {
    $('loginErr').textContent = 'No seed output: run the seed first (RUNBOOK §1.3), then reload.';
  }
  $('go').onclick = start;
  $('p').addEventListener('keydown', (e) => e.key === 'Enter' && start());
})();
</script>
